# 開発用の Judge0（採点）。プロジェクト直下で docker compose up -d を実行すると起動する。
# パスワードはプロジェクト直下の .env に書く（docs/judge0_setup_guide.md を参照）。
name: judge0

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

x-judge0-passwords: &judge0-passwords
  REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?.env に JUDGE0_REDIS_PASSWORD を書いてください}
  POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?.env に JUDGE0_POSTGRES_PASSWORD を書いてください}

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    environment: *judge0-passwords
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    environment: *judge0-passwords
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: docker/judge0/judge0.conf
    environment: *judge0-passwords
    volumes:
      - data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    environment: *judge0-passwords
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *default-logging
    restart: always

volumes:
  data:
